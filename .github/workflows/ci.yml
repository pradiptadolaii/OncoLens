name: Python application checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.17'
          cache: pip
      - name: Install pinned CPU dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Python syntax
        run: python -m compileall -q app.py security.py uploads.py model_artifact.py app scripts tests
      - name: Application import and authenticated startup with mocked weights
        run: python scripts/ci_smoke.py
      - name: Upload security and integrity tests without patient data
        run: python -m pytest -q
      - name: Private model startup, endpoint and memory checks
        if: ${{ hashFiles('models/*.part*') != '' }}
        run: python scripts/runtime_smoke.py
