# Paid proposal only. Creation requires the owner's explicit cost approval.
services:
  - type: web
    runtime: python
    name: oncolens-research
    plan: 1c-2g
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.17
      - key: WEB_CONCURRENCY
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
      - key: UVICORN_ACCESS_LOG
        value: "false"
      - key: ONCOLENS_MAX_IMAGE_PIXELS
        value: "4000000"
      - key: ONCOLENS_USERNAME
        value: researcher
      - key: ONCOLENS_PASSWORD
        generateValue: true
