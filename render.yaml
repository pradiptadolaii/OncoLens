# REVIEW ONLY: standard is paid. Do not create this service without cost approval.
# Deployment is blocked until the authorized checkpoint is supplied to the build
# and the public-access safeguards described in RENDER_DEPLOYMENT.md are resolved.
services:
  - type: web
    runtime: python
    name: oncolens-research
    plan: standard
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.17
      - key: WEB_CONCURRENCY
        value: "1"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
